<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise Up | Create Post</title>

    <link rel="stylesheet" href="post.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="header">

        <a href="dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>

        <h1>Create New Post</h1>
        <nav class="navbar">

    <a href="home.html">
        <i class="fas fa-house"></i>
        <span>Home</span>
    </a>

    <a href="post.html">
        <i class="fas fa-plus-circle"></i>
        <span>Post</span>
    </a>

    <a href="rank.html">
        <i class="fas fa-trophy"></i>
        <span>Rank</span>
    </a>

    <a href="about.html">
        <i class="fas fa-circle-info"></i>
        <span>About</span>
    </a>

</nav>

        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150"
        class="profile-icon">

    </header>
 

    <!-- User Card -->

    <div class="user-card">

      

        <div>

            <h2>Melissa Peters</h2>

            <p>
                Share your latest achievement, event,
                opportunity or success with everyone.
            </p>

        </div>

    </div>

    <!-- Post Text -->

    <div class="post-section">

        <textarea
        class="post-text"
        placeholder="Write something about your achievement..."></textarea>

    </div>

    <!-- Two Column Section -->

    <div class="middle-section">

        <!-- Left -->

        <div class="left-column">

            <h2 class="section-title">Add Media</h2>

            <div class="media-box">

                <div class="media-card">

                    <i class="fas fa-camera"></i>

                    <h3>Photo / Video</h3>

                    <p>Upload Images or Videos</p>

                </div>

                <div class="media-card">

                    <i class="fas fa-link"></i>

                    <h3>External Link</h3>

                    <p>Add a website or portfolio</p>

                </div>

            </div>

        </div>

        <!-- Right -->

        <div class="right-column">

            <h2 class="section-title">

                Content Category

            </h2>

            <div class="category-container">

                <button class="category blue">
                    🎥 Media Clips
                </button>

                <button class="category yellow">
                    🏆 Ranking Achievement
                </button>

                <button class="category lightblue">
                    🖼 Image Post
                </button>

                <button class="category green">
                    🎓 Scholarship
                </button>

                <button class="category red">
                    🎯 Recruitment
                </button>

                <button class="category orange">
                    📢 Event / Contest
                </button>

                <button class="category purple">
                    💼 Job Opportunity
                </button>

                <button class="category pink">
                    ⭐ Personal Achievement
                </button>

            </div>

        </div>

    </div>

    <!-- Bottom Row -->

    <div class="bottom-section">

        <div class="input-group">

            <label>

                Event Date

            </label>

            <input
            type="date"
            class="input-box">

        </div>

        <div class="input-group">

            <label>

                Position Details

            </label>

            <input
            type="text"
            class="input-box"
            placeholder="Software Engineer Intern">

        </div>

    </div>

    <!-- Button -->

    <div class="button-section">

        <button class="post-btn">

            <i class="fas fa-paper-plane"></i>

            Publish Post

        </button>

    </div>

</div>

<script src="post.js"></script>

</body>
</html>
